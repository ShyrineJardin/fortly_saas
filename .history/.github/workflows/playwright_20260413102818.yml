name: Fortly QA Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, prod]

jobs:
  # ── Step 1: Unit Tests ──
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit -- --watchAll=false

  # ── Step 2: Integration Tests ──
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run integration tests
        run: npx playwright test tests/integration_tests/
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          TEST_BUSINESS_EMAIL: ${{ secrets.TEST_BUSINESS_EMAIL }}
          TEST_BUSINESS_PASSWORD: ${{ secrets.TEST_BUSINESS_PASSWORD }}
      - name: Upload integration report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: integration-report
          path: playwright-report/
          retention-days: 30

  # ── Step 3: E2E Tests ──
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npx playwright test tests/e2e_tests/
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          TEST_BUSINESS_EMAIL: ${{ secrets.TEST_BUSINESS_EMAIL }}
          TEST_BUSINESS_PASSWORD: ${{ secrets.TEST_BUSINESS_PASSWORD }}
          TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
          TEST_CLIENT_NAME: ${{ secrets.TEST_CLIENT_NAME }}
          TEST_CLIENT_USERNAME: ${{ secrets.TEST_CLIENT_USERNAME }}
          TEST_CLIENT_MOBILENUMBER: ${{ secrets.TEST_CLIENT_MOBILENUMBER }}
      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 30